name: Ebbline
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Ebbline:
    type: application
    platform: iOS
    sources:
      - path: Ebbline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ebbline
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Ebbline/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ebbline/Ebbline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  EbblineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EbblineTests
      - path: Ebbline.storekit
    dependencies:
      - target: Ebbline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ebbline.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Ebbline:
    build:
      targets:
        Ebbline: all
        EbblineTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Ebbline.storekit
    test:
      config: Debug
      storeKitConfiguration: Ebbline.storekit
      targets:
        - EbblineTests
    archive:
      config: Release
